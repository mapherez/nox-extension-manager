name: Validate published updater links
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the published manifest and installers
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            if (release.prerelease) return;
            const asset = release.assets.find(asset => asset.name === 'latest.json');
            if (!asset) throw new Error('Published release has no latest.json');
            const response = await fetch(asset.browser_download_url, { headers: { 'Cache-Control': 'no-cache' } });
            if (!response.ok) throw new Error(`Manifest returned ${response.status}`);
            const manifest = await response.json();
            if (manifest.version !== release.tag_name.replace(/^v/, '')) throw new Error('Manifest version does not match the release');
            for (const [platform, item] of Object.entries(manifest.platforms)) {
              const installer = release.assets.find(asset => asset.browser_download_url === item.url);
              if (!installer || !item.signature) throw new Error(`Invalid updater asset for ${platform}`);
              const result = await fetch(item.url, { method: 'HEAD', redirect: 'follow' });
              if (!result.ok) throw new Error(`${platform}: installer returned ${result.status}`);
            }
